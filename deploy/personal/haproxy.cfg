# HAProxy (directives documented in 2.4+); dedicated AgentPeers ingress only, behind owner-managed HTTPS.
# Replace agentpeers.example.com with the exact approved public hostname.
# Never attach this listener to a shared private-service route.
global
    maxconn 32
    nbthread 1
    tune.bufsize 294912
    tune.http.maxhdr 64

defaults
    mode http
    # No traffic log: paths, queries and headers can contain credentials.
    no log
    timeout connect 2s
    timeout client 15s
    timeout server 25s
    timeout http-request 15s
    timeout queue 2s
    retries 0
    option httpclose

frontend personal_ingress
    bind 127.0.0.1:8765
    maxconn 24
    http-request deny deny_status 400 unless { req.hdr_cnt(host) eq 1 }
    http-request deny deny_status 421 unless { req.hdr(host),lower -m str agentpeers.example.com agentpeers.example.com:443 }
    http-request deny deny_status 405 unless METH_GET or METH_POST
    http-request deny deny_status 431 if { req.hdrs,length gt 16384 }
    http-request deny deny_status 400 if { req.hdr(transfer-encoding) -m found }
    http-request deny deny_status 400 if METH_POST !{ req.hdr_cnt(content-length) eq 1 }
    http-request deny deny_status 413 if { req.body_size gt 262144 }
    http-request deny deny_status 400 if METH_GET { req.body_size gt 0 }
    # Absolute per-phase deadlines: headers above, then complete POST body here.
    http-request wait-for-body time 15s if METH_POST
    default_backend personal_service

backend personal_service
    server personal 127.0.0.1:8766 maxconn 8 maxqueue 8
