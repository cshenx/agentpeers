name: Bug report
description: Report a reproducible discovery, setup, delivery or receipt problem.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'For vulnerabilities, follow SECURITY.md. Do not include tokens, transcripts, private paths or message databases.'
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: AgentPeers commit/version and affected connection. For local sessions: macOS and Codex/Claude Code versions. For Grokbot/Dot: client versions and Cloudflare or self-hosted deployment; no credentials or callback URLs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected behavior
      description: Identify the supported pair and whether the recipient was busy, idle or unavailable. Redact session names, project paths and account identifiers.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted status
      description: Include redacted message status and whether the receiving agent consumed the message or replied. For the service, include the relevant receiving status without secrets.
    validations:
      required: true
